<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TANDEM VPN | Subscriptions</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* СТИЛИ БЕЗ ИЗМЕНЕНИЙ */
        :root {
            --bg-color: #050505;
            --card-bg: rgba(30, 30, 32, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --text-primary: #ffffff;
            --text-secondary: #98989f;
            --accent-blue: #2997ff;
            --accent-green: #30d158;
            --hover-bg: rgba(255, 255, 255, 0.12);
            --blur: 25px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }

        body {
            background: radial-gradient(circle at top, #1a1a1e 0%, #000000 100%);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
        }

        .container { width: 100%; max-width: 900px; padding-bottom: 60px; }

        /* HEADER */
        .header { text-align: center; margin-bottom: 40px; animation: fadeIn 0.8s ease; }
        .header h1 {
            font-size: 36px; font-weight: 800; letter-spacing: -1px; margin-bottom: 12px;
            background: linear-gradient(135deg, #fff 0%, #a5a5a5 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }
        .header p { color: var(--text-secondary); font-size: 16px; }

        /* SEARCH BAR */
        .search-container {
            margin-bottom: 30px;
            position: sticky;
            top: 20px;
            z-index: 100;
        }
        .search-input {
            width: 100%;
            background: rgba(44, 44, 46, 0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 16px;
            color: white;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        .search-input:focus { border-color: var(--accent-blue); transform: scale(1.01); }

        /* SECTIONS */
        .section-title {
            font-size: 14px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-secondary);
            margin: 30px 0 15px 5px;
            opacity: 0.8;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 16px;
        }

        /* CARD STYLES */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(var(--blur));
            -webkit-backdrop-filter: blur(var(--blur));
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        .card:hover { transform: translateY(-3px); background: var(--hover-bg); border-color: rgba(255,255,255,0.2); box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .card:active { transform: scale(0.97); }

        /* GLOBAL MIX CARD (SPECIAL) */
        .card.global {
            background: linear-gradient(135deg, rgba(41, 151, 255, 0.15) 0%, rgba(30, 30, 32, 0.7) 100%);
            border: 1px solid rgba(41, 151, 255, 0.3);
            grid-column: 1 / -1; /* На всю ширину */
            padding: 30px;
        }
        .card.global .card-title { font-size: 20px; }
        .card.global .flag-icon { font-size: 40px; }

        .card-info { display: flex; align-items: center; gap: 16px; }
        .flag-icon { font-size: 32px; width: 40px; text-align: center; }
        .card-texts { display: flex; flex-direction: column; }
        .card-title { font-weight: 700; font-size: 17px; color: #fff; }
        .card-subtitle { font-size: 13px; color: var(--text-secondary); margin-top: 4px; font-weight: 500; }
        
        .action-icon {
            width: 40px; height: 40px;
            background: rgba(255,255,255,0.1);
            border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            color: var(--accent-blue);
            transition: all 0.2s;
        }
        .card:hover .action-icon { background: var(--accent-blue); color: white; }

        /* TOAST */
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(100px);
            background: rgba(48, 209, 88, 0.25); border: 1px solid var(--accent-green);
            color: #fff; padding: 14px 28px; border-radius: 50px; font-weight: 600;
            backdrop-filter: blur(20px); opacity: 0; transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 1000; display: flex; align-items: center; gap: 10px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* MOBILE ADAPTIVE */
        @media (max-width: 600px) {
            .header h1 { font-size: 28px; }
            .grid { grid-template-columns: 1fr; } /* Одна колонка */
            .card { padding: 18px; }
        }
    </style>
</head>

            { id: 'ua', name: 'Ukraine', desc: '1 servers', icon: '🇺🇦', type: 'country' },
            { id: 'gb', name: 'United Kingdom', desc: '20 servers', icon: '🇬🇧', type: 'country' },
            { id: 'vn', name: 'Vietnam', desc: '1 servers', icon: '🇻🇳', type: 'country' }
            /* PYTHON_INJECT_END */
        ];

        // Элементы
        const regionsGrid = document.getElementById('regions-grid');
        const countriesGrid = document.getElementById('countries-grid');
        const globalSection = document.getElementById('global-section');
        const searchInput = document.getElementById('searchInput');

        // Функция рендера карточки
        function createCard(sub, isGlobal = false) {
            const card = document.createElement('div');
            card.className = `card ${isGlobal ? 'global' : ''}`;
            card.onclick = () => copyLink(sub); 
            
            if (!isGlobal && sub.type === 'country') {
                card.setAttribute('data-name', sub.name.toLowerCase());
            }

            card.innerHTML = `
                <div class="card-info">
                    <div class="flag-icon">${sub.icon}</div>
                    <div class="card-texts">
                        <div class="card-title">${sub.name}</div>
                        <div class="card-subtitle">${sub.desc}</div>
                    </div>
                </div>
                <div class="action-icon"><i class="fas fa-copy"></i></div>
            `;
            return card;
        }

        // РАСПРЕДЕЛЕНИЕ ПО СЕКЦИЯМ
        subscriptions.forEach(sub => {
            if (sub.type === 'global') {
                globalSection.appendChild(createCard(sub, true));
            } else if (sub.type === 'region') {
                regionsGrid.appendChild(createCard(sub));
            } else {
                countriesGrid.appendChild(createCard(sub));
            }
        });

        // ПОИСК
        searchInput.addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const countryCards = document.querySelectorAll('#countries-grid .card');
            
            countryCards.forEach(card => {
                const name = card.getAttribute('data-name');
                if (name.includes(term)) {
                    card.style.display = 'flex';
                } else {
                    card.style.display = 'none';
                }
            });
        });

        // === ФИНАЛЬНЫЙ ФИКС КОПИРОВАНИЯ ===
        function copyLink(sub) {
            const baseUrl = window.location.origin;
            
            // 1. Формируем чистое имя: "TANDEM RU"
            const niceName = `TANDEM_VPN ${sub.id.toUpperCase()}`;
            
            // 2. Кодируем имя для URL
            const encodedName = encodeURIComponent(niceName);
            
            // 3. Формируем ссылку ТОЛЬКО с ?name=
            // Убираем хэштег, так как он вызывает дублирование в HAPP/Streisand
            const link = `${baseUrl}/sub/${sub.id}?name=${encodedName}`;

            navigator.clipboard.writeText(link).then(() => {
                showToast(niceName);
            }).catch(err => {
                alert('Copy failed: ' + link);
            });
        }

        let toastTimeout;
        const toast = document.getElementById('toast');
        function showToast(text) {
            toast.innerHTML = `<i class="fas fa-check-circle" style="color: var(--accent-green)"></i> ${text} Copied!`;
            toast.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { toast.classList.remove('show'); }, 2000);
        }
    </script>
