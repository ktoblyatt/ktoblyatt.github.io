<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>TANDEM VPN | Subscriptions</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

  :root{
    --bg:            #08080a;
    --surface:       rgba(255,255,255,0.035);
    --surface-hi:    rgba(255,255,255,0.06);
    --hairline:      rgba(255,255,255,0.08);
    --text:          #f5f5f7;
    --text-dim:      #86868b;
    --text-faint:    #48484a;
    --accent:        #0a84ff;
    --accent-dim:    rgba(10,132,255,0.14);
    --live:          #30d158;
    --mono: ui-monospace, "SF Mono", "Menlo", monospace;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ height:100%; }
  body{
    margin:0;
    background:
      radial-gradient(1200px 600px at 15% -10%, rgba(10,132,255,0.07), transparent 60%),
      radial-gradient(900px 500px at 100% 10%, rgba(255,255,255,0.03), transparent 55%),
      var(--bg);
    color:var(--text);
    font-family:'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing:antialiased;
    padding: 28px 20px 60px;
  }

  .wrap{ max-width: 720px; margin:0 auto; }

  /* ---------- HEADER ---------- */
  header{ margin-bottom: 22px; }
  header h1{ margin:0; font-size:22px; font-weight:700; letter-spacing:-0.02em; }
  header h1 b{ font-weight:800; color:var(--accent); }
  header p{ margin:4px 0 0; font-size:13px; color:var(--text-dim); }

  /* ---------- SEARCH ---------- */
  .search-wrap{ position:sticky; top:16px; z-index:50; margin: 18px 0 26px; }
  .search{
    width:100%;
    background: rgba(20,20,22,0.85);
    backdrop-filter: blur(20px);
    border: 1px solid var(--hairline);
    border-radius: 14px;
    padding: 13px 16px;
    color: var(--text);
    font-size: 15px;
    font-family: inherit;
    outline: none;
    transition: border-color .2s;
  }
  .search::placeholder{ color: var(--text-faint); }
  .search:focus{ border-color: var(--accent); }

  /* ---------- SECTION LABEL ---------- */
  .group-label{
    font-size:12px; font-weight:600; color:var(--text-dim);
    text-transform:uppercase; letter-spacing:0.06em;
    margin: 26px 2px 8px;
    display:flex; align-items:center; gap:7px;
  }
  .group-label:first-of-type{ margin-top:0; }

  /* ---------- GLOBAL HERO ROW ---------- */
  .global-row{
    display:flex; align-items:center; justify-content:space-between;
    background: linear-gradient(135deg, rgba(10,132,255,0.12), rgba(255,255,255,0.02));
    border: 1px solid rgba(10,132,255,0.28);
    border-radius: 16px;
    padding: 18px 20px;
    cursor:pointer;
    transition: border-color .2s, transform .15s;
  }
  .global-row:hover{ border-color: rgba(10,132,255,0.5); }
  .global-row:active{ transform: scale(0.985); }
  .global-row .card-title{ font-size:17px; }
  .global-row .flag-icon{ font-size:30px; }

  /* ---------- GROUPED LIST (iOS settings style) ---------- */
  .group{
    background:var(--surface);
    border:1px solid var(--hairline);
    border-radius:16px;
    overflow:hidden;
  }
  .row{
    display:flex; align-items:center; justify-content:space-between;
    padding:13px 18px;
    border-bottom:1px solid var(--hairline);
    cursor:pointer;
    transition: background .15s;
  }
  .row:last-child{ border-bottom:none; }
  .row:hover{ background: var(--surface-hi); }
  .row:active{ background: rgba(255,255,255,0.09); }

  .card-info{ display:flex; align-items:center; gap:14px; min-width:0; }
  .flag-icon{ font-size:20px; width:24px; text-align:center; flex-shrink:0; }
  .card-texts{ display:flex; flex-direction:column; min-width:0; }
  .card-title{ font-weight:600; font-size:14.5px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .card-subtitle{ font-size:12px; color:var(--text-dim); margin-top:2px; }

  .action-icon{
    width:30px; height:30px; flex-shrink:0;
    background: rgba(255,255,255,0.05);
    border-radius: 9px;
    display:flex; align-items:center; justify-content:center;
    color: var(--text-dim);
    font-size:12px;
    transition: all .15s;
  }
  .row:hover .action-icon, .global-row:hover .action-icon{ background: var(--accent); color:#fff; }

  .empty{ padding:22px 18px; text-align:center; color:var(--text-faint); font-size:13px; }

  /* ---------- TOAST ---------- */
  .toast{
    position: fixed; bottom: 26px; left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: rgba(20,20,22,0.9);
    border: 1px solid rgba(48,209,88,0.35);
    color: #fff; padding: 12px 22px; border-radius: 100px;
    font-size: 13.5px; font-weight: 600;
    backdrop-filter: blur(20px);
    opacity: 0;
    transition: all .4s cubic-bezier(.175,.885,.32,1.275);
    display:flex; align-items:center; gap:9px;
    z-index: 1000;
  }
  .toast.show{ transform: translateX(-50%) translateY(0); opacity:1; }
  .toast i{ color: var(--live); font-size:13px; }

  @media (max-width:480px){
    header h1{ font-size:20px; }
  }
</style>
</head>

            { id: 'vg', name: 'VG', desc: '4 servers', icon: '🇻🇬', type: 'country' },
            { id: 'sub_vless', name: 'VLESS Protocol', desc: 'Protocol Pack (1767 pcs)', icon: '⚙️', type: 'protocol' },
            { id: 'sub_vmess', name: 'VMESS Protocol', desc: 'Protocol Pack (31 pcs)', icon: '⚙️', type: 'protocol' }
            /* PYTHON_INJECT_END */
  ];

  const regionsGrid   = document.getElementById('regions-grid');
  const countriesGrid = document.getElementById('countries-grid');
  const globalSection = document.getElementById('global-section');
  const searchInput   = document.getElementById('searchInput');

  function createRow(sub, isGlobal = false){
    const row = document.createElement('div');
    row.className = isGlobal ? 'global-row' : 'row';
    row.onclick = () => copyLink(sub);

    if (!isGlobal && sub.type === 'country'){
      row.setAttribute('data-name', sub.name.toLowerCase());
    }

    row.innerHTML = `
      <div class="card-info">
        <div class="flag-icon">${sub.icon}</div>
        <div class="card-texts">
          <div class="card-title">${sub.name}</div>
          <div class="card-subtitle">${sub.desc}</div>
        </div>
      </div>
      <div class="action-icon"><i class="fas fa-copy"></i></div>
    `;
    return row;
  }

  function renderEmpty(container, text){
    container.innerHTML = `<div class="empty">${text}</div>`;
  }

  // РАСПРЕДЕЛЕНИЕ ПО СЕКЦИЯМ
  const regionItems = [];
  const countryItems = [];
  subscriptions.forEach(sub => {
    if (sub.type === 'global'){
      globalSection.appendChild(createRow(sub, true));
    } else if (sub.type === 'region'){
      regionItems.push(sub);
    } else {
      countryItems.push(sub);
    }
  });

  if (regionItems.length){
    regionItems.forEach(sub => regionsGrid.appendChild(createRow(sub)));
  } else {
    renderEmpty(regionsGrid, 'Нет доступных регионов');
  }

  if (countryItems.length){
    countryItems.forEach(sub => countriesGrid.appendChild(createRow(sub)));
  } else {
    renderEmpty(countriesGrid, 'Нет доступных стран');
  }

  // ПОИСК
  searchInput.addEventListener('input', (e) => {
    const term = e.target.value.toLowerCase();
    const countryRows = document.querySelectorAll('#countries-grid .row');
    countryRows.forEach(row => {
      const name = row.getAttribute('data-name') || '';
      row.style.display = name.includes(term) ? 'flex' : 'none';
    });
  });

  // === КОПИРОВАНИЕ ССЫЛКИ ===
  function copyLink(sub){
    const baseUrl = window.location.origin;
    const niceName = `TANDEM_VPN ${sub.id.toUpperCase()}`;
    const encodedName = encodeURIComponent(niceName);
    // Без хэштега — исключает дублирование в HAPP/Streisand
    const link = `${baseUrl}/sub/${sub.id}?name=${encodedName}`;

    navigator.clipboard.writeText(link).then(() => {
      showToast(`${niceName} copied`);
    }).catch(() => {
      alert('Copy failed: ' + link);
    });
  }

  let toastTimeout;
  const toast = document.getElementById('toast');
  const toastText = document.getElementById('toast-text');
  function showToast(text){
    toastText.innerText = text;
    toast.classList.add('show');
    clearTimeout(toastTimeout);
    toastTimeout = setTimeout(() => toast.classList.remove('show'), 2000);
  }
</script>

</html>
